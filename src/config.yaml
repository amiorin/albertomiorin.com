site:
  name: Alberto Miorin
  site: 'https://albertomiorin.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: Alberto Miorin
    template: '%s — Alberto Miorin'
  description: 'Forward Engineer Engineer'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Alberto Miorin
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '@amiorin'
    site: '@amiorin'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: false
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: false
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: false
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: G-QB480W4H6G

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
