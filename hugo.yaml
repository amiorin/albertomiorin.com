# Hugo configuration file
title: Alberto Miorin

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: big-config
      pageRef: /big-config
      weight: 1
    - name: big-container
      pageRef: /big-container
      weight: 1
    - name: rama-jdbc
      pageRef: /rama-jdbc
      weight: 1
    - name: rama-cdp
      pageRef: /rama-cdp
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: "https://github.com/amiorin"
      params:
        icon: github
    - name: Linkedin
      weight: 3
      url: "https://www.linkedin.com/in/albertomiorin/"
      params:
        icon: linkedin

params:
  blog:
    list:
      displayTags: true

  toc:
    displayTags: true

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/amiorin/albertomiorin.com/edit/main/content"

services:
  googleAnalytics:
    id: G-QB480W4H6G
